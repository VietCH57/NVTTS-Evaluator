# Evaluation config. Unknown keys are errors. [ASSUMPTION] marks development choices.
asr:
  backend: sherpa_onnx_offline          # hynt/Zipformer-30M-RNNT-6000h via sherpa-onnx
  model_dir: D:/Work/models/Zipformer-30M-RNNT-6000h   # needs encoder/decoder/joiner .onnx + tokens.txt
  use_int8: false                       # [ASSUMPTION] fp32 weights
  num_threads: 4
  decoding_method: greedy_search

pmos:
  repo_id: prj-beatrice/dnsmos-torch-native
  revision: null                        # pin a commit hash after reading the repo's remote code
  device: auto
  output: ovrl                          # [ASSUMPTION] sig | bak | ovrl | p808

ss:
  source: speechbrain/spkrec-ecapa-voxceleb
  savedir: D:/Work/models/spkrec-ecapa-voxceleb
  device: auto
  ref_mode: centroid                    # [ASSUMPTION] centroid | mean_cosine
  max_reference_clips: null             # e.g. 20 to cap work for speakers with hundreds of clips

wer:
  aggregation: corpus                   # [ASSUMPTION] corpus | sample_mean

text_norm:                              # [ASSUMPTION]
  nfc: true
  lowercase: true
  strip_punct: true

scoring:                                # [ASSUMPTION] normalisation of raw values to [0,1]
  mos_min: 1.0
  mos_max: 5.0
  clip_wer: true
  clip_ss: true

bootstrap:
  n_boot: 2000
  alpha: 0.05
  seed: 0
  min_n: 10

nvpa:
  detector_path: null                   # set to the file written by `train-detector`; enables the nvpa metric
  tolerance_words: 1                    # [ASSUMPTION] symmetric position tolerance (reference words); tune with nvpa-sweep
  # Calibrated with `nvpa-sweep` on the dev ground truth (spec 21.4). Detections off the gold gap were one gap LATE 55 times and
  # EARLY once, so only lateness is tolerated; thresholds x0.75 maximised the lift at a spurious rate below the gold NV density.
  tolerance_before: 0
  tolerance_after: 1
  threshold_scale: 0.75                 # [ASSUMPTION] multiplies the trained thresholds
  min_window: 0.2
  max_window: 3.0
  unreliable_policy: miss               # [ASSUMPTION] events that cannot be localised: miss | exclude
  shuffle_reps: 50

human:
  subset_size: 100
  seed: 0
  rare_type_share: 0.05
  max_rare_fraction: 0.5
  long_utt_seconds: 15.0
  head_speaker_min_utts: 20
  n_gt_anchors: 5
  n_degraded_anchors: 5
  degrade_snr_db: 5.0
  anchor_gt_min: 3.0
  anchor_gap_min: 0.5
  exclude_flagged: true
  auto_on_subset: true                  # [ASSUMPTION] final score uses automatic metrics on the rated subset

